# Install once with:  pre-commit install
default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      # Strict type checking is enforced on the numerical core only. The
      # per-module `strict = true` override lives in pyproject.toml.
      - id: mypy
        name: mypy (strict on tes_pricer.math)
        files: ^src/tes_pricer/math/
        args: ["--config-file=pyproject.toml"]
        additional_dependencies:
          - numpy>=2.1
          - scipy-stubs
          - pandas-stubs
