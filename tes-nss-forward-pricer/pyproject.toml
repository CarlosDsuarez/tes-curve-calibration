[tool.poetry]
name = "tes-nss-forward-pricer"
version = "0.1.0"
description = "Nelson-Siegel-Svensson calibration on Colombian TES and USD/COP forward pricing under CIP."
authors = ["Carlos Suarez <goyosuarez21062004@gmail.com>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "tes_pricer", from = "src" }]
include = [{ path = "src/tes_pricer/config/*.yaml", format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
numpy = "^2.1"
scipy = "^1.14"
pandas = "^2.2"
pyyaml = "^6.0"
requests = "^2.32"
sodapy = "^2.2"
xlwings = "^0.33"

[tool.poetry.group.test.dependencies]
pytest = "^8.3"
pytest-cov = "^5.0"
responses = "^0.25"
openpyxl = "^3.1"
# PyPI distribution name for the QuantLib-Python SWIG bindings is `QuantLib`.
QuantLib = "^1.36"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6"
mypy = "^1.11"
pre-commit = "^3.8"
pandas-stubs = "^2.2"
types-requests = "^2.32"
types-PyYAML = "^6.0"

[tool.poetry.scripts]
tes-pricer = "tes_pricer.interface.cli:main"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
# Default run is the offline, dependency-light suite. Opt in explicitly:
#   pytest -m integration      (needs network)
#   pytest -m benchmark        (needs QuantLib)
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "-m", "not integration and not benchmark",
]
markers = [
    "unit: pure, offline, no network and no QuantLib required",
    "integration: hits a live endpoint (SUAMECA / datos.gov.co); requires network",
    "benchmark: cross-checks numerics against QuantLib; requires QuantLib installed",
]

[tool.coverage.run]
source = ["src/tes_pricer"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]

# --------------------------------------------------------------------------- #
# ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "TID", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests mock the data layer, so they legitimately import requests.
"tests/**" = ["N802", "TID251"]
# The banned-api rule below is a guardrail for `math/`; the data layer is
# exactly where network clients are supposed to live.
"src/tes_pricer/data/**" = ["TID251"]
"scripts/**" = ["TID251"]
# Excel UDF names are the worksheet formula names; they must stay uppercase.
"src/tes_pricer/interface/excel_bridge.py" = ["N802"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests".msg = "Network clients belong in tes_pricer.data, never in tes_pricer.math."
"sodapy".msg = "Network clients belong in tes_pricer.data, never in tes_pricer.math."

[tool.ruff.lint.isort]
known-first-party = ["tes_pricer"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------- #
# mypy - strict on the numerical core, pragmatic elsewhere
# --------------------------------------------------------------------------- #
[tool.mypy]
# Analysed at 3.12 because the numpy >=2.4 stubs use `type` statements that the
# 3.11 parser rejects. The 3.11 floor is still enforced by ruff's
# `target-version = "py311"`, which rejects 3.12-only syntax in our own code.
python_version = "3.12"
mypy_path = "src"
files = ["src", "scripts"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tes_pricer.math.*"
strict = true
disallow_any_unimported = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
# xlwings ships no type information, so its decorators erase the signatures of
# the UDFs below. The functions themselves stay annotated; only the decorator
# check is relaxed.
module = "tes_pricer.interface.excel_bridge"
disallow_untyped_decorators = false
