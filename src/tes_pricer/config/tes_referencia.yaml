metadata:
  fecha_construccion: "2026-09-07"
  numero_bonos: 16
  cobertura_temporal_minima: "1.2 anos"
  cobertura_temporal_maxima: "31.5 anos"
  fecha_referencia_tramos: "2026-09-07"
  fecha_corte_datos_mercado: "2026-08-14"
  definicion_tramos:
    corto: "< 3 anos al vencimiento"
    medio: "3 a 10 anos al vencimiento"
    largo: "> 10 anos al vencimiento"
  fuentes:
    informe_diario_deuda_publica: "https://www.irc.gov.co/documents/d/guest/informe-diario-14-de-agosto-de-2026"
    comunicado_subasta_tes_cop_no_09: "https://www.minhacienda.gov.co/documents/d/portal/informe-tes-subasta-cop-no-09"
    frecuencia_cupon_banrep: "https://www.banrep.gov.co/es/glosario/tes"
    day_count_superfinanciera: "Superintendencia Financiera de Colombia, Circular Basica Contable y Financiera (Circular Externa 100 de 1995), Capitulo I, numerales 6.1.1 b), 6.1.2 y 6.4"
  advertencias:
    - "fecha_emision NO esta verificada con fuente primaria para ningun bono. Se decodifico del nemotecnico (TFIT + plazo original en anos + DDMMYY del vencimiento), convencion que no aparece publicada en un documento oficial de MinHacienda ni de BanRep. La decodificacion es consistente con cinco comprobaciones cruzadas (los plazos remanentes 4/9/14/32 anos que el comunicado de subasta del 13-may-2026 asigna a los TES 2030/2035/2040/2058), pero sigue siendo derivada. No usar para nada distinto de documentacion: la calibracion NSS construye el calendario de cupones hacia atras desde fecha_vencimiento y no lee este campo."
    - "isin queda en null en los 16 bonos. Ni MinHacienda ni BanRep publican el ISIN de los TES en fuente abierta; los unicos ISIN encontrados (formato COL17CT#####) provienen de un proveedor comercial de datos, que no es fuente primaria. El identificador autoritativo de este archivo es `nemotecnico`, que si aparece en el Informe Diario de Deuda Publica."
    - "valor_nominal = 100.0 es la BASE DE COTIZACION (precio limpio por 100 de facial), verificada contra la columna Precio Limpio del informe diario. NO es la denominacion legal minima del titulo, que no se pudo verificar con fuente primaria. Si algun consumidor necesita la denominacion legal, debe obtenerla del reglamento de emision, no de este archivo."
    - "day_count_convention = ACT/365 se toma de la norma de valoracion de la Superintendencia Financiera (dias exactos sobre base de ano de 365 dias), no de un reglamento especifico de TES. Es la convencion que aplica al mercado colombiano de renta fija en COP en su conjunto."
    - "frecuencia_cupon = anual se apoya en el glosario de TES de BanRep, que dice que los TES 'usualmente' pagan un cupon anual fijo. El adverbio es del original. No se encontro un reglamento de emision que lo fije de forma incondicional para cada una de estas 16 referencias."
    - "Los precios, tasas y duraciones (`precio_limpio_ref`, `tasa_ref`, `duracion_ref`) son una foto del 14-ago-2026 y quedan obsoletos de inmediato. Estan aqui como control de sanidad de la calibracion, no como insumo de precios. El pricer debe tomar precios del feed diario."
    - "Se excluyeron del universo: (a) TFIT15260826, que vencia el 26-ago-2026 y cuyo precio venia marcado VAL (valoracion de PRECIA, sin negociacion) en lugar de SEN; (b) TFVT10260331, cuyo prefijo TFVT designa un instrumento distinto que no se pudo caracterizar con fuente primaria; (c) toda la curva TES UVR y los TCO (cero cupon), por ser otra curva."
    - "Los 16 bonos incluidos cotizaron en SEN el 14-ago-2026 segun la columna de fuente del informe. Esa es la unica evidencia de liquidez que respalda el archivo; no hay volumen negociado por referencia."

# ---------------------------------------------------------------------------
# Convenciones de mercado y ajustes del solver. Los valores de `conventions`
# replican los campos por bono de arriba y existen como default para cualquier
# instrumento que se agregue sin declararlos.
# ---------------------------------------------------------------------------
conventions:
  currency: COP
  day_count: ACT/365
  coupon_frequency: 1          # TES tasa fija pagan cupon anual
  business_day_convention: MODIFIED_FOLLOWING
  settlement_lag_days: 3       # T+3 en SEN/MEC
  face_value: 100.0
  quote_type: clean_price      # por 100 de facial

calibration:
  min_instruments: 6           # seis parametros NSS libres
  min_maturity_years: 0.25     # el extremo muy corto lo manda el repo
  max_maturity_years: 35.0
  exclude_stale_after_sessions: 3
  weight_by_inverse_duration: true

# Pilares OIS de IBR para la curva de descuento COP. Pendientes de Fase 2:
# ninguna fuente primaria de fixings IBR por plazo se verifico en esta pasada.
ois_pillars: []

fx:
  pair: USDCOP
  quote_convention: COP_PER_USD
  spot_settlement_lag_days: 2
  standard_tenors: ["1M", "2M", "3M", "6M", "9M", "1Y"]
