# ---------------------------------------------------------------------------
# Universo de TES Tasa Fija en pesos usado como instrumentos de calibracion NSS.
#
# PROVENIENCIA. Las cifras de mercado de este archivo provienen de una unica
# fuente primaria: el "Informe Diario de Deuda Publica" que publica la
# Subdireccion de Financiamiento Interno de la Nacion (Direccion General de
# Credito Publico y Tesoro Nacional, Ministerio de Hacienda y Credito Publico),
# edicion del viernes 14 de agosto de 2026, tabla "Tasa Fija en Pesos".
# Ese informe declara el saldo de emisiones vigentes con corte al 06-ago-2026.
#
# NIVEL DE VERIFICACION POR CAMPO. No todos los campos tienen el mismo respaldo.
# Cada bono lleva `campos_no_verificados`, y el bloque `metadata.advertencias`
# explica el origen de cada limitacion. Leerlo antes de calibrar.
#
#   Verificado con fuente primaria, por bono:
#     nemotecnico, fecha_vencimiento, tasa_cupon_nominal, saldo_vigente_cop_mm,
#     precio_limpio_ref, tasa_ref, duracion_ref, fuente_precio
#   Verificado con fuente primaria, a nivel de mercado (aplica a todos):
#     frecuencia_cupon (BanRep), day_count_convention (SFC CE 100/1995),
#     valor_nominal (base de cotizacion, del propio informe diario)
#   Derivado, NO citado en fuente primaria:
#     fecha_emision (decodificada del nemotecnico), isin (no publicado por
#     MinHacienda/BanRep en fuente abierta; se deja nulo)
# ---------------------------------------------------------------------------
